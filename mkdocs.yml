site_name: Baker
site_description: Local capture, text and formula recognition for macOS
site_url: https://pentagontoy.github.io/Baker/
repo_url: https://github.com/PentagonToy/Baker
repo_name: PentagonToy/Baker
edit_uri: ''
use_directory_urls: false
strict: true
theme:
  variant: modern
  logo: others/assests/icons/baker_logo_light.svg
  favicon: others/assests/icons/baker_logo_light.svg
  font: false
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: amber
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: amber
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - navigation.tabs
  - navigation.top
  - search.highlight
  - content.code.copy
  - navigation.footer
plugins:
- search
markdown_extensions:
- tables
- attr_list
- toc:
    permalink: true
extra:
  google_site_verification: flwxN1rf0OysYtNI7Tged4sc_V5QGQqTJ2KuS55olvg
extra_css:
- stylesheets/brand.css
nav:
- Home: index.md
- Guide:
  - Start here:
    - Get started: help/getting-started.md
    - Overview: overview.md
  - Capture & scan:
    - Capture: guide/capture.md
    - Scan: help/scan.md
    - Record: guide/record.md
  - Text & formulas:
    - Formula: help/formula.md
    - Unicode maths: help/unicode-maths.md
  - Files & history:
    - Clipboard & Files: guide/clipboard-and-files.md
    - Recent: guide/recent.md
    - Save folder & presets: help/storage.md
  - Settings & help:
    - Settings: help/settings.md
    - Help overview: help/README.md
    - Limits: help/limits.md
    - Troubleshooting: help/troubleshooting.md
- More:
  - Models:
    - Engines & models: help/recognition.md
    - Formula downloads: models/README.md
  - Extensions:
    - OCR plugins: help/plugins.md
    - Agent CLI: help/cli.md
  - Project:
    - Changelog: changelog.md
    - Development builds: help/development.md
    - Website & ownership: help/website.md
  - Privacy & notices:
    - Overview: legal/README.md
    - Privacy policy: legal/privacy.md
    - Third-party notices: legal/third-party.md
copyright: Copyright © 2026 PentagonToy
