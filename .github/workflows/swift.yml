name: Swift
on:
  push:
    branches: [main, dev]
    paths: ['Package.swift', 'Sources/**', 'Tests/**', '.github/workflows/swift.yml']
  pull_request:
    paths: ['Package.swift', 'Sources/**', 'Tests/**', '.github/workflows/swift.yml']
permissions:
  contents: read
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - name: Build app executable
        run: swift build --scratch-path "$RUNNER_TEMP/baker-build" --jobs 2 -c release --product Baker
      - name: Standard core tests
        run: swift test --scratch-path "$RUNNER_TEMP/baker-build" --jobs 2
      - name: Synthetic capture archive regression
        run: swift run --scratch-path "$RUNNER_TEMP/baker-build" --jobs 2 BakerCaptureRegression "$RUNNER_TEMP/baker-capture-checks"
      - name: Process and core regression
        run: swift run --scratch-path "$RUNNER_TEMP/baker-build" --jobs 2 BakerRegression
      - name: Synthetic PDF regression
        run: swift run --scratch-path "$RUNNER_TEMP/baker-build" --jobs 2 BakerPDFRegression "$RUNNER_TEMP/baker-pdf-checks"
      - name: Formula rendering regression
        run: swift run --scratch-path "$RUNNER_TEMP/baker-build" --jobs 2 BakerFormulaRegression "$RUNNER_TEMP/baker-formula-checks"
